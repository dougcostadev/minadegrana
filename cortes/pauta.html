<title>Biblioteca Clipes Leonida</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap">
<style>
/*CSS*/
</style>
<div class="pagina">
<header class="topo">
  <p class="marca">Clipes Leonida</p>
  <h1>Biblioteca de clipes</h1>
  <p class="resumo" id="resumo"></p>
</header>
<p id="aviso" class="aviso" role="status">Carregando os clipes…</p>
<nav class="controles" id="controles" aria-label="Filtros da biblioteca" hidden>
  <div class="grupo" role="group" aria-label="Rede">
    <button type="button" class="seg" data-rede="todas">Todas as redes</button>
    <button type="button" class="seg seg-yt" data-rede="yt">YouTube <span class="n" id="n-yt"></span></button>
    <button type="button" class="seg seg-tt" data-rede="tt">TikTok <span class="n" id="n-tt"></span></button>
    <button type="button" class="seg seg-ig" data-rede="ig">Instagram <span class="n" id="n-ig"></span></button>
  </div>
  <div class="grupo" role="group" aria-label="Situação">
    <button type="button" class="seg" data-faixa="livres">Disponíveis <span class="n" id="n-livres"></span></button>
    <button type="button" class="seg" data-faixa="feitos">Postados <span class="n" id="n-feitos"></span></button>
    <button type="button" class="seg" data-faixa="descartados">Descartados <span class="n" id="n-descartados"></span></button>
  </div>
  <div class="grupo ajustes">
    <label class="rotulo-campo" for="busca">Buscar
      <input type="search" id="busca" placeholder="streamer ou palavra do gancho" autocomplete="off">
    </label>
    <label class="rotulo-campo" for="streamer">Streamer
      <select id="streamer"><option value="">Todos</option></select>
    </label>
    <label class="rotulo-campo" for="ordem">Ordenar
      <select id="ordem">
        <option value="novos">Mais novos</option>
        <option value="vistos">Mais vistos na live</option>
        <option value="curtos">Mais curtos</option>
      </select>
    </label>
  </div>
</nav>
<p id="explica" class="explica" hidden></p>
<div id="grade" class="grade"></div>
<details class="guia">
  <summary>Como postar em cada rede</summary>
  <div class="guia-grade"><!--GUIA--></div>
</details>
</div>
<script>
/*JS*/
</script>
