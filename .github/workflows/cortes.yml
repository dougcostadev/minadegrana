name: cortes

on:
  schedule:
    - cron: "17 15,23 * * *"   # 12h17 e 20h17 de Brasília
  workflow_dispatch:
    inputs:
      privacidade:
        description: private | unlisted | public
        default: private

permissions:
  contents: write

concurrency: cortes

jobs:
  cortar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -q -r requirements.txt faster-whisper
      - name: Cortar e publicar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
          PRIVACIDADE: ${{ inputs.privacidade || vars.PRIVACIDADE || 'private' }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > "$YT_COOKIES_FILE"; fi
          python -m cortes auto --privacidade "$PRIVACIDADE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cortes-${{ github.run_id }}
          path: saida/
          if-no-files-found: ignore
          retention-days: 7
      - name: Salvar vídeos já processados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processados.txt
          git diff --cached --quiet || (git commit -qm "Atualiza processados" && git pull -q --rebase && git push -q)
